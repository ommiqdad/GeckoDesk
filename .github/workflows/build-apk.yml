name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Terima lisensi SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build APK debug
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          tail -n 40 build.log
          if [ $code -ne 0 ]; then
            MSG=$(sed -n '/What went wrong/,/^\* Try/p' build.log | head -n 60)
            ERRS=$(grep -E '^(e: |.*error: |.*Unresolved reference)' build.log | head -n 30)
            for T in "$MSG" "$ERRS"; do
              [ -z "$T" ] && continue
              T="${T//'%'/'%25'}"; T="${T//$'\n'/'%0A'}"; T="${T//$'\r'/'%0D'}"
              echo "::error title=Gradle::$T"
            done
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: GeckoDesk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
